<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f9f2e8">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>ספר המתכונים שלי</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f9f2e8;color:#35271f;font:17px system-ui,sans-serif}main{max-width:740px;margin:auto;padding:24px 18px 48px}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(2rem,8vw,3.8rem);margin:.3em 0}button,input,textarea,select{font:inherit;color:inherit}button,input,textarea,select{padding:10px 13px;border:1px solid #cdbbac;border-radius:12px;background:#fffaf4}button{cursor:pointer;min-height:44px}button.primary,button[aria-pressed=true]{background:#713c2a;color:white;border-color:#713c2a}input,textarea,select{width:100%}input[type=checkbox]{width:auto}textarea{min-height:90px}label{display:block;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:10px}.card{text-align:start;overflow-wrap:anywhere}.card img,article img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:9px;margin-bottom:8px}article,form{padding:18px;background:#fffaf4;border-radius:18px}p,li{overflow-wrap:anywhere}li{margin-block:8px}.note{white-space:pre-wrap}small{color:#624e43}a{color:#713c2a}

#landing h1{margin:22px 0 26px;font-size:clamp(2.45rem,10vw,4.7rem);line-height:1.08}
#landing h2{font-size:1.4rem;margin-bottom:10px}
#featured{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px}
#featured .card{flex:0 0 min(76vw,300px);scroll-snap-align:start;padding:10px}
#featured .card img,#featured .placeholder{aspect-ratio:3/2;border-radius:9px}
#featured .placeholder{display:grid;place-items:center;background:#ead8c8;font-size:2.4rem;margin-bottom:8px}
#allRecipes{width:100%;margin-top:16px}
#bookHeader{margin-bottom:12px}
</style>
<main>

<p id="status" role="status"></p><small id="syncStatus" role="status"></small>
<section id="landing">
<h1>ספר המתכונים שלי</h1>
<h2 id="featuredHeading">מתכונים מהספר</h2>
<div id="featured" role="region" aria-labelledby="featuredHeading"></div>
<p id="featuredEmpty" hidden>כשתוסיפי מתכונים, הם יופיעו כאן.</p>
<button id="allRecipes" class="primary">לכל המתכונים</button>
</section>
<section id="home" hidden>
<header id="bookHeader"><button id="backLanding">חזרה למסך הבית</button><h1>כל המתכונים</h1></header>
<div class="row"><button id="add" class="primary">＋ מתכון חדש</button><button id="random">מה נכין היום?</button></div>
<input id="search" type="search" placeholder="חיפוש מתכונים" aria-label="חיפוש מתכונים">
<nav id="categories" class="row" aria-label="קטגוריות"></nav>
<div id="lists"></div>
<footer><div class="row"><button id="backup">הורדת גיבוי</button><button id="restore">שחזור מגיבוי</button><button id="imageSettings">הגדרת תמונות AI וסנכרון</button></div>
<small>המתכונים נשמרים במכשיר הזה. כדאי לשמור גיבוי לפני מעבר למכשיר אחר או מחיקת נתוני הדפדפן.</small>
<input id="importFile" type="file" accept=".json,application/json" hidden></footer>
</section>
<section id="detail" hidden></section>
<section id="editor" hidden>
<button class="back">חזרה לספר</button>
<h2 id="editorTitle"></h2>
<form id="recipeForm">
<label>שם המתכון<input name="title" required maxlength="150"></label>
<label>קטגוריה<select name="category"></select></label>
<label>תמונה<input name="photo" type="file" accept="image/*"></label>
<label id="removePhoto" hidden><input name="remove" type="checkbox"> הסרת התמונה הקיימת</label>
<label>מצרכים וכמויות<textarea name="ingredients" required placeholder="כל מצרך בשורה, עם הכמות בהתחלה. למשל: 1/2 כוס סוכר"></textarea></label>
<label>הוראות הכנה<textarea name="steps" required placeholder="כל שלב בשורה נפרדת"></textarea></label>
<label>זמן הכנה בדקות<input name="prep" type="number" min="0"></label>
<label>זמן בישול בדקות<input name="cook" type="number" min="0"></label>
<label>מספר מנות או יחידות<input name="servings" type="number" min="1" value="4" required></label>
<label>רמת קושי<select name="difficulty"><option>קל</option><option>בינוני</option><option>מאתגר</option></select></label>
<label>הערות וטיפים<textarea name="notes"></textarea></label>
<label>קישור לסרטון המקורי<input name="video" type="url" dir="ltr"></label>
<button class="primary" type="submit">שמירת מתכון</button>
</form>
</section>
<dialog id="imageDialog" dir="rtl">
<form id="imageForm">
<label>קוד הגישה שהגדרת ב־Cloudflare<input id="imageCode" type="password" autocomplete="off" required></label>
<p>כשאין תמונה, שם המתכון יישלח ל־Cloudflare כדי ליצור תמונה. קוד הגישה גם מחבר את המכשיר לספר המתכונים המשותף ב־Cloudflare.</p>
<div class="row"><button type="submit" class="primary">הפעלה</button><button type="button" id="imageOff">כיבוי</button><button type="button" id="imageClose">סגירה</button></div>
</form>
</dialog>
</main>
<script>
'use strict';
const byId = id => document.getElementById(id);
const categories = ['מאפים ולחמים','עוגות וקינוחים','עוגיות','רטבים וממרחים','מרקים'];
const fields = ['title','category','ingredients','steps','prep','cook','servings','difficulty','notes','video'];
const form = byId('recipeForm');
const field = name => form.elements.namedItem(name);
const lines = value => value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
const imageEndpoint = 'https://recipe-image-generator.lia-ducker.workers.dev/';
const codeKey = 'recipe-image-access';
const generating = new Set();
let viewedRecipe = null, viewedData = null;
let recipes = [], category = '', editing = null;
const db = new Promise((resolve, reject) => {
  const request = indexedDB.open('my-recipes', 2);
  request.onupgradeneeded = event => {
    if (event.oldVersion === 0) request.result.createObjectStore('recipes', {keyPath:'id'});
    request.result.createObjectStore('syncState', {keyPath:'id'});
  };
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
async function syncTransaction(mode, work) {
  const database = await db;
  return new Promise((resolve, reject) => {
    const tx = database.transaction(['recipes', 'syncState'], mode);
    const result = work(tx.objectStore('recipes'), tx.objectStore('syncState'));
    tx.oncomplete = () => resolve(result?.result);
    tx.onabort = () => reject(tx.error);
  });
}
async function store(mode, work) {
  const result = await syncTransaction(mode, (table, meta) => {
    if (mode === 'readonly') return work(table);
    return work({
      get: id => table.get(id),
      put(recipe) {
        const request = table.put(recipe);
        markLocal(meta, recipe.id, false);
        return request;
      },
      delete(id) {
        const request = table.delete(id);
        markLocal(meta, id, true);
        return request;
      },
    });
  });
  if (mode === 'readwrite') queueSync();
  return result;
}
const report = message => { byId('status').textContent = message; };
function action(node, run) {
  node.addEventListener('click', async () => {
    report('');
    try { await run(); } catch { report('הפעולה לא הושלמה. אפשר לנסות שוב.'); }
  });
}
function element(tag, content, parent) {
  const node = document.createElement(tag);
  if (content) node.textContent = content;
  parent?.append(node);
  return node;
}
function button(label, parent, run) {
  const node = element('button', label, parent);
  node.type = 'button';
  action(node, run);
  return node;
}
function show(id) {
  if (id !== 'detail') { viewedRecipe = null; viewedData = null; }
  for (const section of ['landing','home','detail','editor']) byId(section).hidden = section !== id;
  window.scrollTo(0, 0);
}
function photo(recipe, parent) {
  if (recipe.photo) {
    const img = element('img', '', parent);
    img.src = recipe.photo;
    img.alt = '';
  }
}
function render() {
  const nav = byId('categories');
  nav.replaceChildren();
  for (const label of ['', ...categories]) {
    const control = button(label || 'הכול', nav, () => { category = label; render(); });
    control.setAttribute('aria-pressed', String(category === label));
  }
  const query = byId('search').value.trim().toLocaleLowerCase();
  const matches = recipes.filter(recipe => (!category || recipe.category === category) &&
    [recipe.title, recipe.ingredients, recipe.notes].some(value => value.toLocaleLowerCase().includes(query)));
  const lists = byId('lists');
  lists.replaceChildren();
  function group(title, items, empty) {
    element('h2', title, lists);
    if (!items.length) { element('p', empty, lists); return; }
    const cards = element('div', '', lists);
    cards.className = 'cards';
    for (const recipe of items) {
      const card = button('', cards, () => detail(recipe));
      card.className = 'card';
      photo(recipe, card);
      element('strong', recipe.title, card);
      element('div', recipe.category, card);
    }
  }
  if (query || category) group(category || 'תוצאות חיפוש', matches, 'אין מתכונים מתאימים.');
  else {
    group('נוספו לאחרונה', matches.slice(0, 4), 'הספר שלך מחכה למתכון הראשון.');
    group('מועדפים', matches.filter(recipe => recipe.favorite), 'אפשר לסמן מתכונים כמועדפים מתוך המתכון.');
    if (matches.length > 4) group('כל המתכונים', matches, '');
  }
}
let featuredIds = [];
function renderFeatured() {
  const available = new Map(recipes.map(recipe => [recipe.id, recipe]));
  featuredIds = featuredIds.filter(id => available.has(id));
  const pool = recipes.filter(recipe => !featuredIds.includes(recipe.id));
  while (featuredIds.length < 5 && pool.length) {
    const index = Math.floor(Math.random() * pool.length);
    featuredIds.push(pool.splice(index, 1)[0].id);
  }

  const carousel = byId('featured');
  const scrollPosition = carousel.scrollLeft;
  carousel.replaceChildren();
  byId('featuredEmpty').hidden = featuredIds.length > 0;
  byId('featuredHeading').hidden = featuredIds.length === 0;
  for (const id of featuredIds) {
    const recipe = available.get(id);
    const card = button('', carousel, () => detail(recipe, 'landing'));
    card.className = 'card';
    if (recipe.photo) photo(recipe, card);
    else {
      const placeholder = element('span', '🍴', card);
      placeholder.className = 'placeholder';
      placeholder.setAttribute('aria-hidden', 'true');
    }
    element('strong', recipe.title, card);
    element('div', recipe.category, card);
  }
  carousel.scrollLeft = scrollPosition;
}
action(byId('allRecipes'), home);
action(byId('backLanding'), () => show('landing'));

async function refresh() {
  recipes = (await store('readonly', table => table.getAll())).sort((a,b) => b.created - a.created);
  render();
  renderFeatured();
}
function home() { render(); show('home'); }
function edit(recipe) {
  editing = recipe;
  form.reset();
  byId('editorTitle').textContent = recipe ? 'עריכת מתכון' : 'מתכון חדש';
  byId('removePhoto').hidden = !recipe?.photo;
  if (recipe) for (const name of fields) field(name).value = recipe[name];
  show('editor');
  field('title').focus();
}
const fraction = {'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function scale(line, ratio) {
  if (ratio === 1) return line;
  const amount = /^(\d+\s+\d+\/\d+|\d*\s*[¼½¾⅓⅔⅛⅜⅝⅞]|\d+\/\d+|\d+(?:[.,]\d+)?)(?=\s|$)/;
  return line.replace(amount, value => {
    const [whole, part] = value.trim().split(/\s+/);
    const number = token => {
      const last = token.at(-1);
      if (last in fraction) return Number(token.slice(0,-1)) + fraction[last];
      const [top, bottom] = token.split('/');
      return bottom === undefined ? Number(top.replace(',','.')) : Number(top)/Number(bottom);
    };
    const quantity = number(whole) + (part ? number(part) : 0);
    return Number.isFinite(quantity) ? new Intl.NumberFormat('he', {maximumSignificantDigits:4}).format(quantity * ratio) : value;
  });
}
function detail(recipe, origin = 'home') {
  viewedRecipe = recipe.id;
  viewedData = recipe;
  const view = byId('detail');
  view.replaceChildren();
  button(origin === 'landing' ? 'חזרה למסך הבית' : 'חזרה לספר', view,
    () => origin === 'landing' ? show('landing') : home());
  const article = element('article', '', view);
  element('h2', recipe.title, article);
  photo(recipe, article);
  element('p', [recipe.category, recipe.difficulty, recipe.prep && 'הכנה ' + recipe.prep + ' דקות',
    recipe.cook && 'בישול ' + recipe.cook + ' דקות'].filter(Boolean).join(' · '), article);
  const controls = element('div', '', article);
  controls.className = 'row';
  const favorite = button(recipe.favorite ? '★ הסרה ממועדפים' : '☆ הוספה למועדפים', controls, async () => {
    const updated = {...recipe, favorite:!recipe.favorite};
    await store('readwrite', table => table.put(updated));
    await refresh();
    Object.assign(recipe, updated);
    favorite.textContent = recipe.favorite ? '★ הסרה ממועדפים' : '☆ הוספה למועדפים';
    favorite.setAttribute('aria-pressed', String(recipe.favorite));
  });
  favorite.setAttribute('aria-pressed', String(recipe.favorite));
  if (!recipe.photo) {
    const generate = button('יצירת תמונת AI', controls, () => generateImage(recipe));
    generate.disabled = generating.has(recipe.id);
  }
  button('עריכה', controls, () => edit(recipe));
  button('מחיקה', controls, async () => {
    if (!confirm('למחוק את המתכון?')) return;
    await store('readwrite', table => table.delete(recipe.id));
    await refresh();
    home();
  });
  const label = element('label', 'מספר מנות או יחידות', article);
  const count = element('input', '', label);
  count.type = 'number';
  count.min = '1';
  count.step = '1';
  count.value = recipe.servings;
  element('h3', 'מצרכים', article);
  const ingredients = lines(recipe.ingredients).map(line => {
    const item = element('label', '', article);
    const check = element('input', '', item);
    check.type = 'checkbox';
    return {line, text:element('span', ' ' + line, item)};
  });
  count.addEventListener('input', () => {
    const ratio = count.valueAsNumber / Number(recipe.servings);
    for (const item of ingredients) item.text.textContent = ' ' + scale(item.line, ratio > 0 ? ratio : 1);
  });
  element('h3', 'הוראות הכנה', article);
  const steps = element('ol', '', article);
  for (const step of lines(recipe.steps)) element('li', step, steps);
  if (recipe.notes) {
    element('h3', 'הערות וטיפים', article);
    element('p', recipe.notes, article).className = 'note';
  }
  if (recipe.video) {
    const link = element('a', 'פתיחת הסרטון המקורי', article);
    link.href = recipe.video;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
  }
  show('detail');
}
function openImageSettings() {
  byId('imageCode').value = localStorage.getItem(codeKey) || '';
  byId('imageDialog').showModal();
}
action(byId('imageSettings'), openImageSettings);
action(byId('imageClose'), () => byId('imageDialog').close());
action(byId('imageOff'), () => {
  localStorage.removeItem(codeKey);
  byId('imageDialog').close();
  report('יצירה אוטומטית של תמונות וסנכרון כובו במכשיר הזה.');
  syncStatus('');
});
byId('imageForm').addEventListener('submit', event => {
  event.preventDefault();
  const code = byId('imageCode').value.trim();
  if (!code) return;
  localStorage.setItem(codeKey, code);
  byId('imageDialog').close();
  report('החיבור הופעל במכשיר הזה.');
  queueSync(0);
});
async function generateImage(recipe) {
  const code = localStorage.getItem(codeKey);
  if (!code) { openImageSettings(); return; }
  if (generating.has(recipe.id)) return;
  generating.add(recipe.id);
  const control = viewedRecipe === recipe.id
    ? [...byId('detail').querySelectorAll('button')].find(node => node.textContent === 'יצירת תמונת AI')
    : null;
  if (control) control.disabled = true;
  report('יוצרת תמונה למתכון…');
  try {
    const response = await fetch(imageEndpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + code},
      body:JSON.stringify({title:recipe.title})
    });
    if (response.status === 401) { report('קוד הגישה לא תואם לקוד ב־Cloudflare.'); return; }
    if (!response.ok) throw new Error('Image request failed');
    const {image} = await response.json();
    if (typeof image !== 'string' || !/^data:image\/jpeg;base64,[A-Za-z0-9+/]+=*$/.test(image)) {
      throw new Error('Invalid image');
    }
    let updated;
    await store('readwrite', table => {
      const request = table.get(recipe.id);
      request.onsuccess = () => {
        const current = request.result;
        if (current && current.title === recipe.title && !current.photo) {
          updated = {...current, photo:image};
          table.put(updated);
        }
      };
    });
    if (updated) {
      await refresh();
      if (viewedRecipe === recipe.id) {
        const article = byId('detail').querySelector('article');
        const imageNode = element('img', '');
        imageNode.src = image;
        imageNode.alt = '';
        article.querySelector('h2').after(imageNode);
        control?.remove();
        if (viewedData) Object.assign(viewedData, updated);
      }
      report('תמונת ה־AI נשמרה במתכון.');
    } else {
      report('המתכון השתנה בזמן יצירת התמונה.');
    }
  } catch {
    report('יצירת התמונה לא הצליחה. אפשר לנסות שוב מתוך המתכון.');
  } finally {
    generating.delete(recipe.id);
    if (control) control.disabled = false;
  }
}
async function imageData(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fffaf4';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', .85);
  } finally { URL.revokeObjectURL(url); }
}
function valid(recipe) {
  return recipe && typeof recipe.id === 'string' && Number.isFinite(recipe.created) &&
    typeof recipe.favorite === 'boolean' && fields.every(name => typeof recipe[name] === 'string') &&
    recipe.title.trim() && lines(recipe.ingredients).length && lines(recipe.steps).length &&
    categories.includes(recipe.category) && /^[1-9]\d*$/.test(recipe.servings) &&
    (!recipe.video || /^https?:\/\//i.test(recipe.video)) &&
    typeof recipe.photo === 'string' && (!recipe.photo || /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(recipe.photo));
}
for (const name of categories) element('option', name, field('category'));
form.addEventListener('submit', async event => {
  event.preventDefault();
  report('');
  const submit = event.submitter;
  submit.disabled = true;
  const original = editing;
  const recipe = {id:original?.id || crypto.randomUUID(), created:original?.created || Date.now(),
    favorite:original?.favorite || false, photo:field('remove').checked ? '' : original?.photo || ''};
  for (const name of fields) recipe[name] = field(name).value.trim();
  try {
    const file = field('photo').files[0];
    if (file) {
      try { recipe.photo = await imageData(file); }
      catch { report('לא הצלחנו לפתוח את התמונה. אפשר לבחור תמונת JPG או PNG.'); return; }
    }
    if (!valid(recipe)) { report('יש למלא שם, מצרכים והוראות. קישור לסרטון צריך להתחיל ב־https:// או http://.'); return; }
    await store('readwrite', table => table.put(recipe));
    await refresh();
    detail(recipe);
    report('המתכון נשמר.');
    if (!original && !recipe.photo && localStorage.getItem(codeKey)) void generateImage(recipe);
  } catch { report('לא הצלחנו לשמור את המתכון.'); }
  finally { submit.disabled = false; }
});
document.querySelectorAll('.back').forEach(node => action(node, home));
action(byId('add'), () => edit(null));
action(byId('random'), () => {
  if (recipes.length) detail(recipes[Math.floor(Math.random() * recipes.length)]);
  else report('כדי לבחור מתכון אקראי, צריך להוסיף מתכון ראשון.');
});
byId('search').addEventListener('input', render);
action(byId('backup'), async () => {
  const data = await store('readonly', table => table.getAll());
  const url = URL.createObjectURL(new Blob([JSON.stringify({version:1, recipes:data})], {type:'application/json'}));
  const link = element('a', '', document.body);
  link.href = url;
  link.download = 'my-recipes-backup-' + new Date().toISOString().slice(0,10) + '.json';
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
});
action(byId('restore'), () => byId('importFile').click());
byId('importFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data?.version !== 1 || !Array.isArray(data.recipes) || !data.recipes.every(valid)) {
      report('הקובץ אינו גיבוי מתאים לגרסה הזאת.');
      return;
    }
    if (!confirm('לשחזר ' + data.recipes.length + ' מתכונים? מתכונים תואמים יעודכנו.')) return;
    await store('readwrite', table => {
      for (const recipe of data.recipes) table.put(recipe);
    });
    await refresh();
    report('הגיבוי שוחזר.');
  } catch { report('לא הצלחנו לקרוא או לשחזר את הגיבוי.'); }
});
const syncEndpoint = new URL('sync', imageEndpoint);
const syncStatus = message => { byId('syncStatus').textContent = message; };
let syncTimer, syncRunning = false;

function queueSync(delay = 800) {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, delay);
}

function markLocal(meta, id, deleted) {
  const request = meta.get(id);
  request.onsuccess = () => {
    meta.put({id, revision:request.result?.revision || 0, token:crypto.randomUUID(), deleted});
  };
}

async function initSync() {
  await syncTransaction('readwrite', (table, meta) => {
    const initialized = meta.get(0);
    initialized.onsuccess = () => {
      if (initialized.result) return;
      const local = table.getAllKeys();
      local.onsuccess = () => {
        for (const id of local.result) markLocal(meta, id, false);
        meta.put({id:0});
      };
    };
  });
}

async function syncRequest(code, options = {}, id) {
  const url = new URL(syncEndpoint);
  if (id !== undefined) url.searchParams.set('id', id);
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 25000);
  try {
    const response = await fetch(url, {
      ...options, signal:controller.signal, cache:'no-store',
      headers:{Authorization:'Bearer ' + code, ...(options.body && {'Content-Type':'application/json'})},
    });
    if (!response.ok) throw Object.assign(new Error('Sync request failed'), {status:response.status});
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function pendingRecord(id) {
  const record = {};
  await syncTransaction('readonly', (table, meta) => {
    const state = meta.get(id);
    const recipe = table.get(id);
    state.onsuccess = () => { record.state = state.result; };
    recipe.onsuccess = () => { record.recipe = recipe.result; };
  });
  return record;
}

async function acknowledge(sent, revision) {
  await syncTransaction('readwrite', (_, meta) => {
    const request = meta.get(sent.id);
    request.onsuccess = () => {
      const current = request.result;
      if (!current || current.revision !== sent.revision) return;
      meta.put({...current, revision, token:current.token === sent.token ? null : current.token});
    };
  });
}

function matchingRecipe(a, b) {
  return a && b && Object.keys(a).length === Object.keys(b).length &&
    Object.keys(a).every(key => a[key] === b[key]);
}

async function applyRemote(remote, expected) {
  if (!remote.deleted && (!valid(remote.recipe) || remote.recipe.id !== remote.id)) {
    throw new Error('Invalid remote recipe');
  }
  let conflict = false, applied = false;
  await syncTransaction('readwrite', (table, meta) => {
    const state = meta.get(remote.id);
    state.onsuccess = () => {
      const current = state.result;
      if (current?.token !== expected?.token ||
          (current?.revision || 0) >= remote.revision) return;
      if (current?.token) {
        const local = table.get(remote.id);
        local.onsuccess = () => {
          const equivalent = current.deleted
            ? remote.deleted
            : !remote.deleted && matchingRecipe(local.result, remote.recipe);
          if (!equivalent && local.result) {
            const copy = {...local.result, id:crypto.randomUUID(),
              title:local.result.title.slice(0, 134) + ' (עותק מקומי)'};
            table.put(copy);
            markLocal(meta, copy.id, false);
          }
          conflict = !equivalent;
          install();
        };
      } else install();

      function install() {
        if (remote.deleted) table.delete(remote.id);
        else table.put(remote.recipe);
        meta.put({id:remote.id, revision:remote.revision, token:null, deleted:remote.deleted});
        applied = true;
      }
    };
  });
  return {conflict, applied};
}

async function runSync() {
  if (syncRunning || document.hidden) return;
  const code = localStorage.getItem(codeKey);
  if (!code) { syncStatus(''); return; }
  if (!navigator.onLine) { syncStatus('הסנכרון יתחדש כשהחיבור יחזור.'); return; }
  syncRunning = true;
  let conflict = false, changed = false, oversized = false;
  try {
    await initSync();
    const states = await syncTransaction('readonly', (_, meta) => meta.getAll());
    for (const entry of states.filter(item => item.token)) {
      const {state, recipe} = await pendingRecord(entry.id);
      if (!state?.token) continue;
      try {
        const result = await syncRequest(code, {
          method:'POST',
          body:JSON.stringify({id:state.id, revision:state.revision, deleted:state.deleted, recipe})
        });
        await acknowledge(state, result.revision);
      } catch (error) {
        if (error.status === 413) { oversized = true; continue; }
        if (error.status !== 409) throw error;
        const remote = await syncRequest(code, {}, state.id);
        const result = await applyRemote(remote, state);
        conflict ||= result.conflict;
        changed ||= result.applied;
      }
    }

    const {recipes:remoteList} = await syncRequest(code);
    for (const entry of remoteList) {
      const {state} = await pendingRecord(entry.id);
      if ((state?.revision || 0) >= entry.revision || state?.token) continue;
      const remote = await syncRequest(code, {}, entry.id);
      const result = await applyRemote(remote, state);
      changed ||= result.applied;
    }
    if (conflict) report('נמצאו שינויים בשני מכשירים. גרסה מקומית שונה נשמרה כעותק כשהייתה זמינה.');
    const remaining = await syncTransaction('readonly', (_, meta) => meta.getAll());
    syncStatus(oversized ? 'מתכון גדול מדי לסנכרון נשאר שמור במכשיר.' :
      remaining.some(item => item.token) ? 'יש שינויים שממתינים לסנכרון.' : 'המתכונים מסונכרנים.');
  } catch (error) {
    syncStatus(error.status === 401 ? 'קוד הגישה לסנכרון אינו תואם. אפשר לעדכן אותו בהגדרות.' :
      'הסנכרון לא הושלם. ננסה שוב אוטומטית.');
  } finally {
    syncRunning = false;
    if (changed) await refresh();
  }
}

window.addEventListener('online', () => queueSync());
window.addEventListener('focus', () => queueSync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) queueSync(); });
setInterval(() => queueSync(0), 25000);

refresh().then(() => queueSync(0)).catch(() => report('אחסון המתכונים אינו זמין בדפדפן כרגע.'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.error);
</script>
